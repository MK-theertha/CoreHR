services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corehr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The Node/Prisma backend owns `corehr`; the FastAPI/Alembic backend
      # gets its own `corehr_fastapi` so the two migration tools never touch
      # the same schema. See scripts/postgres-init-multiple-dbs.sh.
      POSTGRES_MULTIPLE_DATABASES: corehr_fastapi
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d corehr']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'

  fastapi-backend:
    build:
      context: ./fastapi-backend
    ports:
      - '8100:8000'
    environment:
      APP_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/corehr_fastapi
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CLIENT_URL: http://localhost:4173
      AWS_REGION: ap-south-1
      # Left empty: profile-image/document upload endpoints return 501
      # locally rather than erroring against a bucket that doesn't exist.
      S3_UPLOADS_BUCKET: ''
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Same command the production image runs, just with `alembic upgrade
    # head` first — matches "production deployment should use alembic
    # upgrade head", never a dev-only migration command, in every environment.
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - '4100:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/corehr
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CLIENT_URL: http://localhost:4173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Cut over to the FastAPI backend — this is now the live API the
        # frontend talks to. `backend` (Node) is still defined above and can
        # still be run standalone (e.g. `docker compose up backend`), but
        # nothing depends on it anymore.
        VITE_API_BASE_URL: http://localhost:8100/api/v1
    ports:
      - '4173:80'
    depends_on:
      - fastapi-backend
    restart: unless-stopped

volumes:
  postgres_data:
