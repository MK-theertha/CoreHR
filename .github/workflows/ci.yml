name: CoreHR CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corehr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corehr_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Lint frontend
        run: npm run lint --workspace frontend

      - name: Lint backend
        run: npm run lint --workspace backend

      - name: Typecheck backend tests
        run: npm run typecheck:test --workspace backend

      - name: Run backend tests
        run: npm test --workspace backend

      - name: Prisma migrate deploy check
        run: npm run prisma:migrate:deploy --workspace backend

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Build backend
        run: npm run build --workspace backend

  fastapi-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corehr_fastapi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corehr_fastapi_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-access-secret-not-used-in-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-production

    defaults:
      run:
        working-directory: fastapi-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: fastapi-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Alembic migrate (production command — never a dev-only one)
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t corehr-fastapi-backend:ci .
